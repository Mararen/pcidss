{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña | PCI Cert Pro</title>
    <link rel="stylesheet" href="{% static 'users/css/main.css' %}">
</head>
<body class="login-page">

    <section class="login-hero">
        <img src="{% static 'users/img/banner.jpg' %}" alt="Banner">
        <div class="login-hero-overlay">
            <img src="{% static 'users/img/logo.png' %}" class="login-logo">
        </div>
    </section>

    <section class="login-wrapper">
        <div class="login-card">

            <h2 style="font-size:17px; margin-bottom:4px;">Recuperar contraseña</h2>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:8px;">
                Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            {% if message %}
                <div class="login-error" style="color:var(--success); background:var(--success-bg);">
                    {{ message }}
                </div>
            {% endif %}

            {% if error %}
                <div class="login-error">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <label>Correo electrónico</label>
                <input type="email" name="email" required placeholder="tucorreo@empresa.com">
                <button type="submit" class="btn-primary" style="width:100%; margin-top:14px;">
                    Enviar enlace
                </button>
            </form>

            <div class="forgot" style="margin-top:14px;">
                <a href="{% url 'login' %}">↶ Volver al inicio de sesión</a>
            </div>

        </div>
    </section>

</body>
</html>
