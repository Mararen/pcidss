{% extends 'users/base.html' %}
{% load static %}

{% block title %}Entidad | PCI Cert Pro{% endblock %}

{% block content %}

<div class="page-header">
    <h1>{% if form.instance.pk %}Editar Entidad{% else %}Nueva Entidad{% endif %}</h1>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
				<div class="form-actions">
                <button type="submit" class="btn-primary">
                    Guardar
                </button>
				<a href="{% url 'entidades_lista' %}" class="btn-secondary">
                    Cancelar
                </a>
        </div>
    </form>
</div>

{% endblock %}
