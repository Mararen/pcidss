{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | PCI Cert Pro</title>
    <link rel="stylesheet" href="{% static 'users/css/main.css' %}">
</head>
<body class="login-page">

    <!-- HERO / BANNER -->
    <section class="login-hero">
        <img src="{% static 'users/img/banner.jpg' %}" alt="Banner">

        <div class="login-hero-overlay">
            <img src="{% static 'users/img/logo.png' %}" class="login-logo">
        </div>
    </section>

    <!-- LOGIN -->
    <section class="login-wrapper">

        <div class="login-card">

            <form method="post">
                {% csrf_token %}

                {% if error %}
                    <div class="login-error">{{ error }}</div>
                {% endif %}

                <label>Nombre de usuario</label>
                <input type="text" name="username" value="{{ remembered_user }}">

                <label>Contraseña</label>
                <input type="password" name="password" required>

                <label class="remember">
                    <input type="checkbox" name="remember"
                        {% if request.POST.remember %}checked{% endif %}>
                    Recordarme
                </label>

                <!-- reCAPTCHA v3 -->
                <input type="hidden" name="g-recaptcha-response" id="g-recaptcha-response">

                <button type="submit" class="btn-primary" id="btn-login">
                    Iniciar Sesión
                </button>

                <div class="forgot">
                    <a href="{% url 'forgot_password' %}">¿Olvidaste tu contraseña?</a>
                </div>

            </form>

        </div>

    </section>

    <script src="https://www.google.com/recaptcha/api.js?render={{ recaptcha_site_key }}"></script>
<script>
    grecaptcha.ready(function() {
        document.getElementById('btn-login').addEventListener('click', function(e) {
            e.preventDefault();
            grecaptcha.execute('{{ recaptcha_site_key }}', {action: 'login'}).then(function(token) {
                document.getElementById('g-recaptcha-response').value = token;
                document.querySelector('form').submit();
            });
        });
    });
</script>

</body>
</html>
