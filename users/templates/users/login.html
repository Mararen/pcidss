{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | PCI Cert Pro</title>
    <link rel="stylesheet" href="{% static 'users/css/main.css' %}">
</head>
<body class="login-page">

    <!-- HERO / BANNER -->
    <section class="login-hero">
        <img src="{% static 'users/img/banner.jpg' %}" alt="Banner">

        <div class="login-hero-overlay">
            <img src="{% static 'users/img/logo.png' %}" class="login-logo">
        </div>
    </section>

    <!-- LOGIN -->
    <section class="login-wrapper">

        <div class="login-card">

            <form method="post">
                {% csrf_token %}

                {% if error %}
                    <div class="login-error">{{ error }}</div>
                {% endif %}

                <label>Nombre de usuario</label>
                <input type="text" name="username" value="{{ remembered_user }}">

                <label>Contraseña</label>
                <input type="password" name="password" required>

                <label class="remember">
                    <input type="checkbox" name="remember"
                        {% if request.POST.remember %}checked{% endif %}>
                    Recordarme
                </label>

                <!-- reCAPTCHA -->
                <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>

                <button type="submit" class="btn-primary">
                    Iniciar Sesión
                </button>

                <div class="forgot">
                    <a href="{% url 'forgot_password' %}">¿Olvidaste tu contraseña?</a>
                </div>

            </form>

        </div>

    </section>

    <script src="https://www.google.com/recaptcha/api.js"></script>
</body>
</html>
