{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SAQ | PCI Cert Pro</title>
    <link rel="stylesheet" href="{% static 'users/css/main.css' %}">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="profile">
            <img src="{% static 'users/img/profile.png' %}">
            <h4>{{ request.user.username }}</h4>
        </div>

        <nav class="menu">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'usuarios_lista' %}">Usuarios</a>
            <a href="{% url 'entidades_lista' %}">Entidades</a>
            <a href="{% url 'saq_lista' %}" class="active">SAQ</a>
            <a href="{% url 'logout' %}">Salir</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <header class="topbar">
            <h2>Tipos de SAQ</h2>
        </header>

        <section class="content">

            <div class="saq-tipo-grid">

                {% for tipo in tipos %}
                    <a href="{% url 'saq_editor' tipo.pk %}" class="saq-tipo-card">
                        <h3>{{ tipo.nombre }}</h3>
                        <p>{{ tipo.secciones.count }} secciones</p>
                    </a>
                {% empty %}
                    <p>No hay SAQ creados</p>
                {% endfor %}

            </div>

        </section>

    </main>
</div>

</body>
</html>
