{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cerrar sesión | PCI Cert Pro</title>
    <link rel="stylesheet" href="{% static 'users/css/main.css' %}">
</head>
<body class="login-page">

    <!-- Reutiliza el mismo hero del login -->
    <section class="login-hero">
        <img src="{% static 'users/img/banner.jpg' %}" alt="Banner">
        <div class="login-hero-overlay">
            <img src="{% static 'users/img/logo.png' %}" class="login-logo">
        </div>
    </section>

    <section class="login-wrapper">
        <div class="login-card" style="text-align:center;">

            <!-- Ícono -->
            <div style="
                display:inline-flex; align-items:center; justify-content:center;
                width:56px; height:56px; border-radius:50%;
                background:rgba(239,68,68,.10); color:#ef4444;
                margin-bottom:1.25rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </div>

            <h2 style="font-size:17px; font-weight:700; margin:0 0 6px;">
                ¿Cerrar sesión?
            </h2>
            <p style="font-size:13px; color:var(--text-muted); margin:0 0 1.5rem; line-height:1.5;">
                Estás a punto de salir de <strong>PCI Cert Pro</strong>.<br>
                Asegúrate de haber guardado tus cambios.
            </p>

            <!-- Log out con CSRF -->
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-primary"
                        style="width:100%; background:#ef4444; border-color:#ef4444; margin-bottom:.75rem;">
                    Sí, cerrar sesión
                </button>
            </form>

            <!-- Cancelar y volver -->
            <a href="javascript:history.back()"
               style="display:block; font-size:13px; color:var(--text-muted); text-decoration:none; margin-top:4px;">
                ↶ Cancelar y volver
            </a>

            <p style="margin-top:1.25rem; font-size:12px; color:var(--text-muted);">
                Sesión activa como
                <strong>{{ request.user.get_full_name|default:request.user.username }}</strong>
            </p>

        </div>
    </section>

</body>
</html>
