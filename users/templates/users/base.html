{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PCI Cert Pro{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'users/css/main.css' %}">
</head>
<body>

<div class="layout">

    {% include 'users/components/sidebar.html' %}

    <main class="main-content">

        <header class="topbar">
            <nav class="topbar-nav">
                <a href="{% url 'catalogos:home' %}">Catálogos</a>
                <a href="{% url 'config_general' %}">Configuración</a>
                <a href="{% url 'helpdesk:ticket_lista' %}">Ayuda</a>
            </nav>
			 
            <div class="topbar-right">
			<!--
                <span class="topbar-username">
                    {{ request.user.get_full_name|default:request.user.username }}
                </span>
                Logout → GET muestra confirmación, POST ejecuta cierre - Desactivado de momento para verificar UX
                <a href="{% url 'logout' %}" class="topbar-logout" title="Cerrar sesión">
                    <i data-feather="log-out"></i>
                    Salir
                </a> 
			-->
			
            </div>
        </header>

        <section class="content">
            {% block content %}{% endblock %}
        </section>

    </main>
</div>

<!-- ── Logout automático por inactividad ── -->
<form id="auto-logout-form" method="post" action="{% url 'logout' %}" style="display:none;">
    {% csrf_token %}
</form>

<!-- ── Modal de advertencia de inactividad ── -->
<div id="inactivity-modal" style="display:none; position:fixed; inset:0;
     background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; border-radius:16px; padding:32px; max-width:400px;
                width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.3);">
        <i data-feather="clock" style="width:48px; height:48px; color:#f59e0b; margin-bottom:16px;"></i>
        <h2 style="font-size:18px; font-weight:700; margin-bottom:8px;">¿Sigues ahí?</h2>
        <p style="font-size:14px; color:var(--text-muted); margin-bottom:8px;">
            Tu sesión expirará por inactividad en
        </p>
        <p style="font-size:32px; font-weight:700; color:#ef4444; margin-bottom:20px;"
           id="inactivity-countdown"></p>
        <div style="display:flex; gap:12px; justify-content:center;">
            <button onclick="extenderSesion()"
                    style="padding:10px 24px; background:var(--primary); color:white;
                           border:none; border-radius:8px; font-size:14px;
                           font-weight:600; cursor:pointer;">
                Continuar sesión
            </button>
            <!-- POST directo → cierra sesión sin pasar por pantalla de confirmación -->
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit"
                        style="padding:10px 24px; background:#f1f5f9; color:var(--text-dark);
                               border:none; border-radius:8px; font-size:14px;
                               font-weight:600; cursor:pointer;">
                    Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'users/js/feather.min.js' %}"></script>
<script>feather.replace();</script>
{% block extra_js %}{% endblock %}

<script>
(function () {
    // SESSION_SECONDS coincide con SESSION_COOKIE_AGE en settings (900 = 15 min).
    const SESSION_SECONDS = 900;
    const WARNING_SECONDS = 60;   // Muestra el  modal 60 segundos antes de expirar.

    let warningTimer, logoutTimer, countdownInterval;
    let secondsLeft = WARNING_SECONDS;

    function resetTimers() {
        clearTimeout(warningTimer);
        clearTimeout(logoutTimer);
        clearInterval(countdownInterval);
        document.getElementById('inactivity-modal').style.display = 'none';
        secondsLeft = WARNING_SECONDS;

        // Muestra la advertencia cuando falten segundos para expirar.
        warningTimer = setTimeout(
            mostrarAdvertencia,
            (SESSION_SECONDS - WARNING_SECONDS) * 1000
        );

        // Logout automático al llegar al límite.
        logoutTimer = setTimeout(function () {
            document.getElementById('auto-logout-form').submit();
        }, SESSION_SECONDS * 1000);
    }

    function mostrarAdvertencia() {
        secondsLeft = WARNING_SECONDS;
        document.getElementById('inactivity-modal').style.display = 'flex';
        feather.replace();

        countdownInterval = setInterval(function () {
            secondsLeft--;
            const m = Math.floor(secondsLeft / 60);
            const s = secondsLeft % 60;
            document.getElementById('inactivity-countdown').textContent =
                (m > 0 ? m + 'm ' : '') + s + 's';

            if (secondsLeft <= 0) {
                clearInterval(countdownInterval);
                document.getElementById('auto-logout-form').submit();
            }
        }, 1000);
    }

    // Extiende la sesión: hace ping al servidor para renovar la cookie.
    window.extenderSesion = function () {
        fetch("{% url 'dashboard' %}", { credentials: 'same-origin' })
            .catch(function () {});
        resetTimers();
    };

    // Resetea timers en cualquier actividad del usuario.
    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function (ev) {
        document.addEventListener(ev, resetTimers, { passive: true });
    });

    resetTimers();
})();
</script>

</body>
</html>
