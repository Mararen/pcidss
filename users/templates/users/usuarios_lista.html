{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" href="{% static 'users/css/main.css' %}">
</head>
<body>

<div class="layout">

<aside class="sidebar">
    <nav class="menu">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'usuarios_lista' %}" class="active">Usuarios</a>
        <a href="{% url 'entidades_lista' %}">Entidades</a>
        <a href="{% url 'saq_lista' %}">SAQ</a>
    </nav>
</aside>

<main class="main-content">

<h1>Usuarios</h1>

<table>
{% for user in usuarios %}
<tr>
<td>{{ user.username }}</td>
<td>
<a href="{% url 'usuario_detalle' user.pk %}">Ver</a>
</td>
</tr>
{% endfor %}
</table>

</main>
</div>
</body>
</html>
