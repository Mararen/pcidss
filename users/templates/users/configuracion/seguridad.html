{% extends 'users/configuracion/base.html' %}

{% block config_content %}

<form id="formSeguridad">
    {% csrf_token %}

    <label>Longitud mínima</label>
    <input type="number" name="longitud" value="{{ politica.longitud_minima }}" required>

    <label>Días de vigencia</label>
    <input type="number" name="dias" value="{{ politica.dias_vigencia }}" required>

    <label>Intentos fallidos</label>
    <input type="number" name="intentos" value="{{ politica.intentos_fallidos }}" required>

    <label>
        <input type="checkbox" name="numeros" {% if politica.requiere_numeros %}checked{% endif %}>
        Requiere números
    </label>

    <label>
        <input type="checkbox" name="mayusculas" {% if politica.requiere_mayusculas %}checked{% endif %}>
        Mayúsculas
    </label>

    <label>
        <input type="checkbox" name="simbolos" {% if politica.requiere_simbolos %}checked{% endif %}>
        Símbolos
    </label>

    <button type="button" class="btn-save" onclick="abrirModal()">
    Guardar
</button>

<div id="modal" style="display:none;">
    <p>¿Confirmar cambios?</p>
    <button onclick="guardar()">Sí</button>
</div>

{% endblock %}

{% block extra_js %}
<script>
function abrirModal() {
    document.getElementById("modal").style.display = "block";
}

function guardar() {
    const form = document.getElementById("formSeguridad");

    fetch("", {
        method: "POST",
        body: new FormData(form),
        headers: {
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(r => r.json())
    .then(data => {
        alert(data.success ? "Guardado correctamente" : data.error);
    });
}
</script>
{% endblock %}
