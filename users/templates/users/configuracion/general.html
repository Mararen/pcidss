{% extends 'users/configuracion/base.html' %}

{% block config_content %}

<form id="formConfig" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Nombre del sistema</label>
    <input type="text" name="nombre" value="{{ config.nombre_sistema }}" required>

    <label>Tiempo de sesión (minutos)</label>
    <input type="number" name="tiempo" value="{{ config.tiempo_sesion }}" required>

    <label>Idioma</label>
    <select name="idioma">
        <option value="es" {% if config.idioma == 'es' %}selected{% endif %}>Español</option>
        <option value="en">Inglés</option>
    </select>

    <label>Zona horaria</label>
    <input type="text" name="zona" value="{{ config.zona_horaria }}" required>

    <label>Logo</label>
    <input type="file" name="logo" accept=".png,.jpg,.jpeg">

    <div class="form-actions">
    <button type="button" class="btn-save" onclick="guardarConfig()">
        Guardar configuración
    </button>
    <button type="reset" class="btn-reset">
        Restablecer
    </button>
</div>

{% endblock %}

{% block extra_js %}
<script>
function guardarConfig() {
    const form = document.getElementById("formConfig");

    fetch("", {
        method: "POST",
        body: new FormData(form),
        headers: {
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            alert("Configuración guardada correctamente");
        } else {
            alert(data.error);
        }
    });
}
</script>
{% endblock %}
